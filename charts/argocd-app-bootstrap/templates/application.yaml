{{- range $projectName, $projectSettings := .Values.projects }}
{{- range $projectSettings.applications }}
{{ if (ne .enabled false) }}
{{- $appName := .name }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $appName }}
  namespace: argocd
  labels:
    {{- toYaml (merge (default (dict) .labels) (index $.Values.projects $projectName).labels) | nindent 4}}
  {{- if .deleteAppResourcesOnAppDeletion }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
spec:
  project: "{{ $projectName }}"
  syncPolicy:
    {{- if .autoSync.enabled }}
    automated:
      selfHeal: {{ .autoSync.selfHeal }}
      prune: {{ .autoSync.prune }}
    {{- end }}
    managedNamespaceMetadata:
      labels:
        {{- toYaml (merge (default (dict) .labels) (index $.Values.projects $projectName).labels) | nindent 8}}
    syncOptions:
    {{- range $syncOptionKey,$syncOptionValue := (merge (default (dict) .extraSyncOptions) $.Values.global.appSpec.extraSyncOptions) }}
      - {{ $syncOptionKey }}={{ $syncOptionValue }}
    {{- end }}
    retry:
      limit: 6
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
  {{- $sourceCtx := dict "app" . "projectName" $projectName "appName" $appName "root" $ }}
  {{- if .extraValueSources }}
  {{- $baseSource := include "argocd-app-bootstrap.applicationSource" $sourceCtx | trim | splitList "\n" }}
  sources:
    - {{ index $baseSource 0 }}
    {{- range $lineIdx, $line := $baseSource }}
    {{- if gt $lineIdx 0 }}
      {{- printf "\n%s" ($line | indent 6) }}
    {{- end }}
    {{- end }}
    {{- range .extraValueSources }}
    - repoURL: "{{ .repoURL }}"
      targetRevision: "{{ .targetRevision | default $.Values.targetRevision }}"
      ref: {{ .ref | default "values" }}
    {{- end }}
  {{- else }}
  source:
    {{- include "argocd-app-bootstrap.applicationSource" $sourceCtx | trim | nindent 4 }}
  {{- end }}
  destination:
    server:  {{ .destinationCluster | default "https://kubernetes.default.svc"}}
    namespace: {{ .namespace }}
  {{- with .ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
